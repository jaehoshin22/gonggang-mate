<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="공강메이트">
  <meta property="og:description" content="각자 에브리타임 시간표 캡처를 올리면 같이 비는 시간을 찾아 줘요.">
  <title>공강메이트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1><a href="/" class="home-link">
      <svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7dff"/><stop offset="1" stop-color="#5b48e0"/></linearGradient></defs><rect x="2" y="4" width="20" height="18" rx="5" fill="url(#lg)"/><rect x="6.5" y="1.5" width="2.6" height="5" rx="1.3" fill="#5b48e0"/><rect x="14.9" y="1.5" width="2.6" height="5" rx="1.3" fill="#5b48e0"/><path d="M8 13.5l2.8 2.8L16 11" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      공강메이트</a></h1>
  </header>

  <main>
    <!-- 첫 화면: 그룹 만들기 -->
    <section id="step-home" class="step" hidden>
      <div class="hero">
        <div class="hero-art" aria-hidden="true">
          <img src="img/hero-people.webp" alt="" width="260" height="144">
        </div>
        <h2>우리, 언제 <em>만날까?</em></h2>
        <p>링크를 카톡방에 공유하면<br>같이 비는 시간을 찾아 줘요.</p>
      </div>

      <label class="field">
        <span>그룹 이름 (선택)</span>
        <input id="group-name" maxlength="30" placeholder="예: 소융 밥약">
      </label>
      <button id="create-group" class="btn btn-primary btn-arrow" type="button">그룹 만들고 링크 받기
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p id="home-error" class="error-text" hidden></p>
      <p class="note note-info">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 11v6M12 7.5v.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        캡처는 인식에만 쓰고 저장하지 않아요.
      </p>
    </section>

    <!-- 그룹 결과: 주간 시간표가 메인 -->
    <section id="step-group" class="step" hidden>
      <div id="group-head" class="group-head"></div>
      <div id="my-action"></div>
      <div id="group-result"></div>
    </section>

    <!-- 내 시간표 올리기 -->
    <section id="step-join" class="step" hidden>
      <h2 class="page-title" id="join-title">내 시간표 올리기</h2>
      <label class="field">
        <span>내 이름</span>
        <input id="join-name" maxlength="20" placeholder="친구들이 알아볼 이름">
      </label>
      <label class="upload-box" for="join-file">
        <strong id="join-file-label">내 시간표 캡처 선택</strong>
        <span>에브리타임 시간표 탭을 캡처해서 올려 주세요</span>
        <input id="join-file" type="file" accept="image/*" hidden>
      </label>
      <img id="join-preview" class="join-preview" alt="선택한 캡처" hidden>
      <p id="join-error" class="error-text" hidden></p>
      <div class="bottom-bar two">
        <button class="btn btn-ghost" type="button" id="join-cancel">취소</button>
        <button id="join-next" class="btn btn-primary" type="button">인식하기</button>
      </div>
    </section>

    <!-- 인식 결과 확인·수정 -->
    <section id="step-review" class="step" hidden>
      <div id="review-panel"></div>
      <div id="review-error" class="review-error" hidden></div>
      <div class="bottom-bar two">
        <button id="review-back" class="btn btn-ghost" type="button">이전</button>
        <button id="review-next" class="btn btn-primary" type="button">그룹에 저장</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
