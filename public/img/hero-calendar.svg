      <rect x="66" y="108" width="22" height="18" rx="5"/><rect x="94" y="108" width="22" height="18" rx="5"/><rect x="150" y="108" width="18" height="18" rx="5"/>
      <rect x="66" y="132" width="22" height="16" rx="5"/><rect x="94" y="132" width="22" height="16" rx="5"/>
